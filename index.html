<link id="fav" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌱%3C/text%3E%3C/svg%3E">
<style>
:root{--ink:#3b2a1e;--card:#f6ecd9;--accent:#d9824b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:ui-rounded,"SF Pro Rounded","Nunito","Trebuchet MS",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;transition:filter 4s}
body[data-act="2"] canvas{filter:saturate(.8)}
body[data-act="3"] canvas{filter:saturate(.6) contrast(1.08)}
body[data-act="4"] canvas{filter:saturate(.45) contrast(1.2) sepia(.15)}
body.final canvas{filter:none}
#hud{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:6px;align-items:flex-start;pointer-events:none;z-index:5;flex-wrap:wrap}
.pill{background:rgba(246,236,217,.93);color:var(--ink);border:3px solid #3b2a1e;border-radius:14px;padding:4px 9px;font-weight:800;font-size:14px;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.35)}
#hud .sp{flex:1}
#hud button{pointer-events:auto;padding:4px 9px}
body.final #hud .pill,body.final #bar,body.nohud #bar{display:none}
button{font:inherit;font-weight:800;border:3px solid #3b2a1e;border-radius:14px;background:var(--card);color:var(--ink);padding:6px 10px;box-shadow:0 3px 0 rgba(0,0,0,.35);cursor:pointer}
button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
button:disabled{opacity:.45}
#bar{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;z-index:5}
#bar .slot{width:50px;height:50px;font-size:24px;padding:0;position:relative;display:flex;align-items:center;justify-content:center}
#bar .slot small{position:absolute;bottom:0;right:3px;font-size:10px}
#bar .slot.on{background:#ffd27a;transform:translateY(-4px)}
#act{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(76px + env(safe-area-inset-bottom));width:86px;height:86px;border-radius:50%;font-size:12px;line-height:1.1;z-index:6;display:none;background:#ffd27a;padding:4px;white-space:pre-line}
body.touch #act{display:block}
body.touch #bar{left:auto;right:calc(112px + env(safe-area-inset-right));transform:none}
body[data-act="4"] .pill,body[data-act="4"] button{background:#2a221d;color:#d8cfc4;border-color:#000}
#toast{position:fixed;left:50%;top:20%;transform:translate(-50%,-20px);opacity:0;background:rgba(30,22,16,.92);color:#f6ecd9;padding:10px 16px;border-radius:14px;font-size:15px;max-width:86vw;text-align:center;transition:.3s;z-index:30;white-space:pre-line;pointer-events:none;border:2px solid #000}
#toast.show{opacity:1;transform:translate(-50%,0)}
.ov{position:fixed;inset:0;background:rgba(10,6,4,.62);display:flex;align-items:center;justify-content:center;z-index:40;padding:18px}
.ov.hidden{display:none}
.card{background:var(--card);color:var(--ink);border:4px solid #3b2a1e;border-radius:20px;padding:16px;max-width:440px;width:100%;max-height:84vh;overflow:auto;box-shadow:0 6px 0 rgba(0,0,0,.4)}
body[data-act="3"] .card{background:#e4d8c4}
body[data-act="4"] .card{background:#1f1a17;color:#ddd3c8;border-color:#000}
.card h2{margin:0 0 10px;font-size:19px}
.card .ln{opacity:0;animation:fin .7s forwards;margin:9px 0;white-space:pre-line;line-height:1.42}
.card .ln.red{color:#a01818;font-weight:800}
body[data-act="4"] .card .ln.red{color:#e04040}
.card input{width:100%;font:inherit;font-size:17px;padding:10px 12px;border-radius:12px;border:3px solid #3b2a1e;margin-top:8px;background:#fff;color:var(--ink)}
.card .go{width:100%;margin-top:14px;background:var(--accent);color:#fff;opacity:0;animation:fin .5s forwards;padding:10px}
.row{display:flex;align-items:center;gap:10px;padding:8px 4px}
.row+.row{border-top:2px dashed rgba(59,42,30,.15)}
.row .ic{font-size:26px;width:34px;text-align:center}
.row .tx{flex:1;font-size:14px;font-weight:800}
.row .tx small{display:block;opacity:.7;font-weight:500}
.sec{font-weight:900;margin:12px 0 2px;font-size:13px;opacity:.6;text-transform:uppercase;letter-spacing:.05em}
.entry{padding:8px 2px;font-size:13px}
.entry+.entry{border-top:2px dashed rgba(59,42,30,.15)}
.entry b{display:block;margin-bottom:3px}
.entry p{margin:3px 0;white-space:pre-line}
.letter{background:#fffaf0;border:2px solid #cdb999;border-radius:6px;padding:12px;font-family:Georgia,serif;font-style:italic;white-space:pre-line;margin:8px 0;color:#3b2a1e;line-height:1.45}
.letter.blood{background:#f3e6dc;border-color:#7a1a12;box-shadow:inset 0 0 30px rgba(120,10,10,.25)}
.paper{background:#ece3cf;border:2px solid #9b8f76;padding:12px;font-family:"Times New Roman",serif;color:#222;margin:8px 0;white-space:pre-line}
.paper b{display:block;font-size:18px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s;z-index:35}
#fade.on{opacity:1}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:36;transition:opacity .5s}
#crash{position:fixed;inset:0;z-index:90;background:#e9e9e9;color:#333;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;text-align:center;padding:30px}
#crash.hidden{display:none}
#crash .big{font-size:64px}
#crash h1{font-size:20px;margin:14px 0 6px}
#crash p{font-size:13px;color:#777;margin:4px}
#crash button{margin-top:22px;background:#4a6fd8;color:#fff;border:0;border-radius:6px;box-shadow:none;padding:10px 22px}
#crash.evil{background:#000;color:#b01010}
#crash.evil p{color:#801010}
#ending{background:#000;z-index:70}
#ending .card{background:transparent;color:#cfc8c0;text-align:center;font-size:17px;border:0;box-shadow:none}
#ending .go{background:#222;color:#ccc;border-color:#444}
#ending.cute{background:linear-gradient(#bfe6ff,#fff4e6)}
#ending.cute .card{color:#3b2a1e}
#ending.cute .go{background:#d9824b;color:#fff;border-color:#3b2a1e}
#dbg{position:fixed;right:6px;top:56px;z-index:80;display:flex;flex-direction:column;gap:3px;font-size:10px;max-width:150px}
#dbg button{font-size:10px;padding:3px 6px;background:#111;color:#0f0;border:1px solid #0f0;border-radius:6px;box-shadow:none}
#dbg div{background:#111;color:#0f0;padding:4px 6px;border-radius:6px;white-space:pre}
/* ---- avvio a schermo intero + orizzontale ---- */
#start,#rotate{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;color:#3b2a1e;background:radial-gradient(circle at 50% 40%,#bfe39a,#7fb85a 60%,#4f8a3a)}
#start.hidden,#rotate.hidden{display:none}
#start .logo{font-size:min(16vh,72px);animation:bob 1.6s ease-in-out infinite}
#start h1{margin:0;font-size:min(9vh,40px);text-shadow:0 3px 0 #f6ecd9}
#start button{font-size:min(6vh,24px);padding:12px 28px;background:#ffd27a;animation:pulse 1.4s ease-in-out infinite}
#start p{margin:0;font-size:13px;font-weight:700;opacity:.75;max-width:420px}
#rotate{z-index:110;background:#1d1a16;color:#f6ecd9;display:none}
#rotate .ph{font-size:64px;animation:rot 2s ease-in-out infinite}
#rotate b{font-size:20px}
#start,#rotate{cursor:pointer}
#rotate .tap{margin-top:14px;padding:8px 14px;border:3px solid #f6ecd9;border-radius:4px;font-size:15px;animation:pulse 1.4s ease-in-out infinite}
#rotate .tap:empty{display:none}
@media (orientation:portrait){body.touch #rotate:not(.hidden){display:flex}}
#start .sub{margin:0;font-size:14px;font-weight:700;min-height:1.2em;white-space:pre-line}
/* avvio: si guasta col procedere della storia */
#start.s2{background:radial-gradient(circle at 50% 40%,#b9cf98,#7f9a5e 60%,#556b40)}
#start.s2 .logo{animation-duration:2.6s}
#start.s3{background:radial-gradient(circle at 50% 40%,#8c8a6e,#55523d 60%,#2a2820);color:#2a1d14}
#start.s3 h1{text-shadow:0 3px 0 #b8ab90}
#start.s3 .logo{animation:sag 4s ease-in-out infinite;filter:saturate(.5)}
#start.s3 button{background:#cdbf9a;animation:none}
#start.s3 .sub{color:#4a1010;opacity:.85}
#start.s4,#start.s5{background:radial-gradient(circle at 50% 45%,#2a0d0b,#110605 55%,#000);color:#d8cfc4}
#start.s4 h1,#start.s5 h1{color:#b01a1a;text-shadow:0 0 12px rgba(160,0,0,.6);animation:jit .18s steps(2) infinite}
#start.s4 .logo,#start.s5 .logo{animation:beat 1.1s ease-in-out infinite}
#start.s4 button,#start.s5 button{background:#2a221d;color:#d8cfc4;border-color:#000;animation:none}
#start.s4 .sub,#start.s5 .sub{color:#e04040}
#start.s4::after,#start.s5::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 2px,transparent 2px 4px);mix-blend-mode:multiply}
#start.s5 h1{color:#6d6d6d;text-shadow:none;animation:none}
#start.eco .sub{color:#7a1a12;opacity:.7}
#start .flick{animation:none!important;opacity:.15}
@keyframes sag{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg) translateY(4px)}}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.12)}24%{transform:scale(1)}36%{transform:scale(1.08)}}
@keyframes jit{0%{transform:translate(0,0)}50%{transform:translate(-1px,1px)}100%{transform:translate(1px,0)}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
/* layout orizzontale basso (smartphone) */
@media (orientation:landscape) and (max-height:500px){
  #hud{top:calc(6px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));right:calc(8px + env(safe-area-inset-right))}
  .pill{font-size:13px;padding:3px 8px;border-width:2px}
  #hud button{padding:3px 8px;border-width:2px}
  #bar{bottom:calc(8px + env(safe-area-inset-bottom))}
  #bar .slot{width:44px;height:44px;font-size:21px}
  #act{width:78px;height:78px;bottom:calc(14px + env(safe-area-inset-bottom));right:calc(14px + env(safe-area-inset-right))}
  body.touch #bar{right:calc(104px + env(safe-area-inset-right))}
  #toast{top:16%;font-size:14px;max-width:70vw}
  .ov{padding:8px calc(10px + env(safe-area-inset-right)) 8px calc(10px + env(safe-area-inset-left))}
  .card{max-width:min(640px,92vw);max-height:calc(100vh - 16px);padding:12px 16px;border-width:3px}
  .card h2{font-size:17px;margin-bottom:6px}
  .card .ln{margin:6px 0;font-size:14px}
  .card .go{margin-top:10px;padding:8px}
  .card input{margin-top:4px;padding:8px 10px}
  #crash .big{font-size:44px}
  #dbg{top:44px}
}
/* ================= TEMA PIXEL ================= */
:root{--px:"DotGothic16","Pixelify Sans",ui-monospace,monospace;--frame:#383848;--paper:#f8f8f0;--inner:#6890c8}
html,body{font-family:var(--px)}
canvas{image-rendering:pixelated}
.pill,button,.card,#toast,.card input{font-family:var(--px)}
.pill{background:var(--paper);color:var(--frame);border:3px solid var(--frame);border-radius:4px;box-shadow:inset 0 -3px 0 #c8c8d0,0 3px 0 rgba(0,0,0,.4);font-weight:600}
button{background:var(--paper);color:var(--frame);border:3px solid var(--frame);border-radius:4px;box-shadow:inset 0 -3px 0 #c8c8d0,0 3px 0 rgba(0,0,0,.4);font-weight:600}
button:active{box-shadow:inset 0 3px 0 #c8c8d0,0 1px 0 rgba(0,0,0,.4)}
#bar .slot{border-radius:4px}
#bar .slot.on{background:#f8d048;box-shadow:inset 0 -3px 0 #d0a030,0 3px 0 rgba(0,0,0,.4)}
#act{background:#f8d048;border:4px solid var(--frame);box-shadow:inset -4px -4px 0 #d0a030,inset 4px 4px 0 #fff0a0,0 4px 0 rgba(0,0,0,.4);font-weight:700}
#act:disabled{opacity:.55}
.card{background:var(--paper);color:var(--frame);border:4px solid var(--frame);border-radius:8px;box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 6px var(--inner),0 5px 0 rgba(0,0,0,.45);padding:18px 20px}
.card h2{font-weight:700;letter-spacing:.02em}
.card .ln{font-size:16px}
.card .go{background:#e86848;color:#fff;border:3px solid var(--frame);box-shadow:inset 0 -4px 0 #b84030,0 3px 0 rgba(0,0,0,.4);text-shadow:2px 2px 0 rgba(0,0,0,.25)}
.card input{border:3px solid var(--frame);border-radius:4px;background:#fff}
.row+.row,.entry+.entry{border-top:2px dotted rgba(56,56,72,.3)}
#toast{background:var(--paper);color:var(--frame);border:4px solid var(--frame);border-radius:6px;box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 4px var(--inner),0 4px 0 rgba(0,0,0,.4);font-weight:600;padding:12px 18px}
body[data-act="2"]{--inner:#8aa070}
body[data-act="3"]{--inner:#a08070;--paper:#ece4d4}
body[data-act="3"] .card{background:var(--paper)}
body[data-act="4"]{--inner:#6a1010;--paper:#1f1a17;--frame:#000}
body[data-act="4"] .card,body[data-act="4"] #toast{background:#1f1a17;color:#ddd3c8;border-color:#000}
body[data-act="4"] .pill,body[data-act="4"] button{background:#2a221d;color:#d8cfc4;border-color:#000;box-shadow:inset 0 -3px 0 #120e0c,0 3px 0 rgba(0,0,0,.5)}
body[data-act="4"] #act{background:#4a1a14;color:#e8d8c8;box-shadow:inset -4px -4px 0 #2a0a08,inset 4px 4px 0 #6a2a20,0 4px 0 rgba(0,0,0,.5)}
body[data-act="4"] .card .go{background:#6a1010;box-shadow:inset 0 -4px 0 #3a0808}
#ending .card{box-shadow:none}
#ending.cute .card{box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 6px #6890c8,0 5px 0 rgba(0,0,0,.45)}
#start h1{font-family:var(--px);font-weight:700;letter-spacing:.03em}
#start .sub,#start p,#rotate{font-family:var(--px)}
#start button{background:#f8d048;box-shadow:inset 0 -4px 0 #d0a030,0 4px 0 rgba(0,0,0,.4)}
#start.s3 button{background:#cdbf9a;box-shadow:inset 0 -4px 0 #a09070,0 4px 0 rgba(0,0,0,.4)}
#start.s4 button,#start.s5 button{background:#2a221d;box-shadow:inset 0 -4px 0 #120e0c,0 4px 0 rgba(0,0,0,.5)}
#start::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(255,255,255,.07) 50%,transparent 50%);background-size:100% 6px}
#start>*{position:relative}
#start h1{letter-spacing:.06em;text-shadow:3px 3px 0 rgba(255,255,255,.55)}
#start.s4 h1,#start.s5 h1{text-shadow:0 0 10px rgba(160,0,0,.6),3px 3px 0 #000}
@media (orientation:landscape) and (max-height:500px){
  .card{padding:12px 16px;max-height:calc(100vh - 16px)}
  .card .ln{font-size:15px;margin:6px 0}
  #toast{font-size:14px;padding:8px 14px}
}
#goal{position:fixed;top:calc(50px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:5;pointer-events:none;max-width:72vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--px);font-size:14px;padding:5px 12px;background:var(--paper);color:var(--frame);border:3px solid var(--frame);border-radius:4px;box-shadow:inset 0 -3px 0 #c8c8d0,0 3px 0 rgba(0,0,0,.4);transition:opacity .3s}
#goal:empty,body.final #goal{display:none}
#goal.sleep{background:#f8d048;box-shadow:inset 0 -3px 0 #d0a030,0 3px 0 rgba(0,0,0,.4)}
body[data-act="3"] #goal.sleep{background:#cdbf9a;box-shadow:inset 0 -3px 0 #a09070,0 3px 0 rgba(0,0,0,.4)}
body[data-act="4"] #goal{background:#2a221d;color:#e04040;border-color:#000;box-shadow:none}
@media (orientation:landscape) and (max-height:500px){#toast{top:calc(78px + env(safe-area-inset-top))}#goal{top:calc(44px + env(safe-area-inset-top));font-size:13px;padding:3px 10px}}
@keyframes fin{to{opacity:1}}
</style>
</head>

const ART = 3; // unità mondo per pixel art

function resize() {

  const zt = clamp(Math.max(Math.min(innerWidth, innerHeight) / 600, innerHeight / 950), 0.62, 1.25);

function surface() {

function move(dt) {
  let ax = 0, ay = 0;
  if (!frozen && !mOpen) {
    if (keys.w || keys.arrowup) ay -= 1; if (keys.s || keys.arrowdown) ay += 1;
    if (keys.a || keys.arrowleft) ax -= 1; if (keys.d || keys.arrowright) ax += 1;
    if (joy) { ax += joy.dx; ay += joy.dy; }
  }
  const m = Math.hypot(ax, ay); if (m > 1) { ax /= m; ay /= m; }
  const sp = scene === "final" ? 140 : scene === "under" ? 130 : 175;
  if (ax) pl.face = ax > 0 ? 1 : -1;
  if (m > 0.1) pl.dir = Math.abs(ay) > Math.abs(ax) * 1.2 ? (ay < 0 ? "u" : "d") : "s";
  pl.walk = m > 0.1 ? pl.walk + dt * 10 : 0;
  pl.moving = m > 0.1;
  const r = 13, [sw, sh] = SIZE[scene], cols = colliders();
  const ok = (nx, ny) => {
    if (nx < 20 || nx > sw - 20 || ny < 30 || ny > sh - 15) return false;
    for (const c of cols) { const cx = clamp(nx, c.x, c.x + c.w), cy = clamp(ny, c.y, c.y + c.h); if (dist(cx, cy, nx, ny) < r) return false; }
    if (scene === "farm" || scene === "final") for (const t of trees) if (dist(t.x, t.y, nx, ny) < 16 * t.s + r) return false;
    if (scene === "under" && dist(HEART.x, HEART.y, nx, ny) < HEART.r) return false;
    return true;
  };
  const ox = pl.x, oy = pl.y, nx = pl.x + ax * sp * dt, ny = pl.y + ay * sp * dt;
  if (ok(nx, pl.y)) pl.x = nx;
  if (ok(pl.x, ny)) pl.y = ny;
  pl.stepAcc += Math.hypot(pl.x - ox, pl.y - oy);
  if (pl.stepAcc > 34) { pl.stepAcc = 0; if (scene !== "final") SND.fx.step(surface()); }
}

/* ---------------- assenze ---------------- */
function detectCheat() {

}

}
function applyAbsence(ms, kind, start, end) {

    if (!q.w) { dry++; continue; }

  }

  if (kind === "closed") maybeAdvance();

  if (eco.endings > 0 && !p.flags.eco) { p.flags.eco = 1; L.push(`Bentornato${eco.last ? ", " + eco.last : ""}.\nTi ricordi la strada per il pozzo?`); red.add(L.length - 1); }

      for (let i = 0; i < n; i++) Object.assign(free.splice(Math.floor(Math.random() * free.length), 1)[0], { ...emptyPlot(), t: 1 });
      L.push(`Hai chiuso gli occhi. Ho preso ${n} ${n === 1 ? "aiuola" : "aiuole"}.\nAdesso ${n === 1 ? "è una tomba" : "sono tombe"}. Indovina di chi è l'ultima.`); red.add(L.length - 1);

/* ---------------- visibilità ---------------- */
/* Sul telefono "chiudere l'app" quasi sempre mette la pagina in pausa invece di chiuderla:
   quindi su touch un'assenza abbastanza lunga conta SEMPRE come chiusura (occhi chiusi).
   Si ascoltano tutti gli eventi del ciclo di vita, e un'assenza si conta una volta sola. */
function goneAway() {

function cameBack() {

  const a = p.hiddenSince, b = now(), ms = b - a;

document.addEventListener("visibilitychange", () => {

});
addEventListener("pagehide", goneAway);

addEventListener("pageshow", e => { if (e.persisted) cameBack(); });

let finalOn = false;
function updateFinal(dt) {
  if (!finalOn) return;
  const g = ghost;
  if (g.look > 0) {
    g.look -= dt; g.face = pl.x > g.x ? 1 : -1;
    if (pl.moving && dist(pl.x, pl.y, g.x, g.y) < 520) {
      g.seen++; SND.fx.sting(); $("#flash").style.transition = "none"; $("#flash").style.opacity = 0.8; requestAnimationFrame(() => { $("#flash").style.transition = "opacity .6s"; $("#flash").style.opacity = 0; });
      pl.x = 1250; pl.y = 880; g.look = 0.3;
      toast(g.seen >= 2 ? `${g.name} ti ha visto.\nMuoviti solo quando ti dà le spalle.` : `${g.name} ti ha visto.\nHa pensato fosse un'ombra. Riprova.`);
    }
    return;
  }
  if (g.warn > 0) { g.warn -= dt; if (g.warn <= 0) { g.look = 1.8; } return; }
  g.nextLook -= dt;
  if (g.nextLook <= 0) { g.warn = 0.7; g.nextLook = 4 + Math.random() * 4; SND.fx.music([12, 7]); return; }
  const tgt = g.pts[(g.i + 1) % g.pts.length], dx = tgt[0] - g.x, dy = tgt[1] - g.y, d = Math.hypot(dx, dy);
  if (d > 500) { g.i = (g.i + 1) % g.pts.length; g.x = tgt[0]; g.y = tgt[1]; return; }
  const sp = 110 * dt;
  if (d < sp) { g.i = (g.i + 1) % g.pts.length; g.x = tgt[0]; g.y = tgt[1]; }
  else { g.x += dx / d * sp; g.y += dy / d * sp; if (Math.abs(dx) > 1) g.face = dx > 0 ? 1 : -1; }
  g.walk += dt * 10;
  if (dist(pl.x, pl.y, g.x, g.y) < 60 && pl.moving) { g.look = 1.2; }
  if (dist(pl.x, pl.y, HOUSE.x, HOUSE.y + 14) < 45) finishGame();
}

/* ---------------- logica ogni secondo ---------------- */
let sec = 0;
setInterval(() => {
  if (!p || ended || scene === "final") return;
  const vis = !document.hidden;
  if (vis && !mOpen && !frozen) {
    stare++; if (stare > p.stareMax) p.stareMax = stare;
    if (him.cool > 0) him.cool--;
    if (scene === "farm" && ((p.act === 3 && stare > 45) || (p.act >= 4 && p.flags.a4)) && !him.on && !him.cool) spawnHim();
    if (p.act >= 4 && p.flags.a4) {
      for (const q of p.plots) if (!q.t && q.s && q.w) q.g += 1000 * SPEED * fertMul();
      if (stare % 30 === 0) p.energy = Math.min(emax(), p.energy + 1);
    }
    if (scene === "farm" && sec % 2 === 0) { trail.push([pl.x | 0, pl.y | 0]); if (trail.length > 300) trail.shift(); }
  }
  if (++sec % 15 === 0 && vis) { p.lastSeen = now(); save(); }
  if (sec % 90 === 0) uploadTrail();
  updHud();
}, 1000);

function audioState() {

  const a = scene === "final" ? 0 : p.act, night = isNight() && scene !== "final";
  const music = scene === "final" ? !ended : scene === "farm" ? a <= 3 : scene === "house" ? a <= 2 : false;
  return {
    act: a, scene, night, music: music && !mOpen,

/* =====================================================================
   GRAFICA PIXEL ART — il mondo è disegnato su una tela a bassa risoluzione
   (1 pixel art = ART unità mondo) e poi ingrandito senza sfocature.
   ===================================================================== */
const OUT = "#2a1e16";
const A = v => Math.round(v / ART);
const hsh = (a, b) => { let h = (a * 374761393 + b * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

function P(x, y, c) { pg.fillStyle = c; pg.fillRect(Math.round(x), Math.round(y), 1, 1); }
function addEll(c, cx, cy, rx, ry) {
  rx = Math.max(0.5, rx); ry = Math.max(0.5, ry); const iy = Math.round(ry);
  for (let y = -iy; y <= iy; y++) { const t = y / (ry + 0.5), w = Math.round(rx * Math.sqrt(Math.max(0, 1 - t * t))); c.rect(Math.round(cx) - w, Math.round(cy) + y, 2 * w + 1, 1); }
}
function E(cx, cy, rx, ry, col, c = pg) { c.beginPath(); addEll(c, cx, cy, rx, ry); c.fillStyle = col; c.fill(); }
function EO(cx, cy, rx, ry, col, o = OUT) { E(cx, cy, rx + 1, ry + 1, o); E(cx, cy, rx, ry, col); }

function LN(x0, y0, x1, y1, col, w = 1) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy;
  pg.fillStyle = col; const o = Math.floor((w - 1) / 2);

  try { const id = localStorage.getItem("orto_pid"); if (id) sv = JSON.parse(localStorage.getItem("orto_save_" + id)); } catch {}
  if (sv) { act = Math.max(0, Math.min(4, +sv.act || 0)); ended = sv.ended ? 1 : 0; name = String(sv.name || "").slice(0, 16); }
  const st = $("#start"), h1 = st.querySelector("h1"), lg = st.querySelector(".logo"), sub = st.querySelector(".sub"), bt = $("#startBtn");
  const nm = name && name !== "Contadino" ? name : "";
  let lvl = ended ? 5 : act >= 4 ? 4 : act >= 3 ? 3 : act >= 2 ? 2 : 0;
  const L = {
    0: ["🌱", "Il Mio Orticello", "", "▶ Tocca per giocare"],
    2: ["🌿", "Il Mio Orticello", nm ? `Bentornato, ${nm}! L'orto ti aspettava.` : "L'orto ti aspettava.", "▶ Tocca per giocare"],
    3: ["🥀", "Il Mio Orticello", nm ? `${nm}, hai dormito tanto.\nQualcuno ha lavorato al posto tuo.` : "Hai dormito tanto.\nQualcuno ha lavorato al posto tuo.", "▶ Apri gli occhi"],
    4: ["🩸", "Il Mio Orticello.", "Non chiudere più gli occhi.", "▶ Torna da me"],
    5: ["👁️", "Il Mio Orticello.", "Sei ancora qui.", "▶ …"],
  }[lvl];
  if (!sv && eco.endings > 0) { st.classList.add("eco"); L[2] = "Bentornato."; }
  if (lvl) st.classList.add("s" + lvl);
  [lg.textContent, h1.textContent, sub.textContent, bt.textContent] = L;
  if (lvl >= 2) document.querySelector('meta[name="theme-color"]').content = lvl >= 4 ? "#000000" : "#2b2a22";
  /* piccoli guasti casuali: titolo/logo che cambiano per un attimo */
  const glitches = {
    0: eco.endings > 0 ? [["logo", "🩸", 120]] : [],
    2: [["logo", "🥀", 160]],
    3: [["h1", "Il Mio Orticello.", 400], ["logo", "👁️", 200], ["flick", "", 140]],
    4: [["h1", "NON CHIUDERE", 260], ["h1", "Il Mio Corpo.", 300], ["logo", "👁️", 250], ["flick", "", 90], ["sub", nm ? `${nm}, ${nm}, ${nm}` : "ti vedo", 500]],
    5: [["h1", "Grazie per il corpo.", 600], ["logo", "🌱", 300]],
  }[lvl] || [];
  if (!glitches.length) return;
  const els = { h1, logo: lg, sub };
  const tick = () => {
    if (st.classList.contains("hidden")) return;
    const [k, txt, ms] = pick(glitches);
    if (k === "flick") { const kids = st.querySelectorAll(".logo,h1,.sub,button"); kids.forEach(e => e.classList.add("flick")); setTimeout(() => kids.forEach(e => e.classList.remove("flick")), ms); }
    else { const e = els[k], old = e.textContent; e.textContent = txt; setTimeout(() => e.textContent = old, ms); }
    setTimeout(tick, (lvl >= 4 ? 900 : lvl === 3 ? 1800 : 4000) + Math.random() * (lvl >= 4 ? 1800 : 3500));
  };
  setTimeout(tick, lvl >= 4 ? 700 : 2500);
})();
/* un tocco OVUNQUE (schermata d'avvio o avviso "ruota") avvia il gioco a schermo intero.
   Su Android il blocco in orizzontale gira lo schermo da solo. */
let started = false;
function startGame() {
  SND.init(); goFull();
  if (started) return; started = true;
  $("#start").classList.add("hidden");
  boot();
}
$("#start").addEventListener("click", startGame);
$("#rotate").addEventListener("click", startGame);
if (fsCan && screen.orientation && screen.orientation.lock) $("#rotTap").textContent = "👆 Tocca lo schermo: si gira da solo a schermo intero";
else $("#rotTap").textContent = "👆 Oppure tocca per iniziare";
</script>
