<style>
:root{--ink:#3b2a1e;--card:#f6ecd9;--accent:#d9824b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:ui-rounded,"SF Pro Rounded","Nunito","Trebuchet MS",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;transition:filter 4s}
body[data-act="2"] canvas{filter:saturate(.8)}
body[data-act="3"] canvas{filter:saturate(.6) contrast(1.08)}
body[data-act="4"] canvas{filter:saturate(.45) contrast(1.2) sepia(.15)}
body.final canvas{filter:none}
#hud{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:6px;align-items:flex-start;pointer-events:none;z-index:5;flex-wrap:wrap}
.pill{background:rgba(246,236,217,.93);color:var(--ink);border:3px solid #3b2a1e;border-radius:14px;padding:4px 9px;font-weight:800;font-size:14px;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.35)}
#hud .sp{flex:1}
#hud button{pointer-events:auto;padding:4px 9px}
body.final #hud .pill,body.final #bar,body.nohud #bar{display:none}
button{font:inherit;font-weight:800;border:3px solid #3b2a1e;border-radius:14px;background:var(--card);color:var(--ink);padding:6px 10px;box-shadow:0 3px 0 rgba(0,0,0,.35);cursor:pointer}
button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
button:disabled{opacity:.45}
#bar{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;z-index:5}
#bar .slot{width:50px;height:50px;font-size:24px;padding:0;position:relative;display:flex;align-items:center;justify-content:center}
#bar .slot small{position:absolute;bottom:0;right:3px;font-size:10px}
#bar .slot.on{background:#ffd27a;transform:translateY(-4px)}
#act{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(76px + env(safe-area-inset-bottom));width:86px;height:86px;border-radius:50%;font-size:12px;line-height:1.1;z-index:6;display:none;background:#ffd27a;padding:4px;white-space:pre-line}
body.touch #act{display:block}
body.touch #bar{left:auto;right:calc(112px + env(safe-area-inset-right));transform:none}
body[data-act="4"] .pill,body[data-act="4"] button{background:#2a221d;color:#d8cfc4;border-color:#000}
#toast{position:fixed;left:50%;top:20%;transform:translate(-50%,-20px);opacity:0;background:rgba(30,22,16,.92);color:#f6ecd9;padding:10px 16px;border-radius:14px;font-size:15px;max-width:86vw;text-align:center;transition:.3s;z-index:30;white-space:pre-line;pointer-events:none;border:2px solid #000}
#toast.show{opacity:1;transform:translate(-50%,0)}
.ov{position:fixed;inset:0;background:rgba(10,6,4,.62);display:flex;align-items:center;justify-content:center;z-index:40;padding:18px}
.ov.hidden{display:none}
.card{background:var(--card);color:var(--ink);border:4px solid #3b2a1e;border-radius:20px;padding:16px;max-width:440px;width:100%;max-height:84vh;overflow:auto;box-shadow:0 6px 0 rgba(0,0,0,.4)}
body[data-act="3"] .card{background:#e4d8c4}
body[data-act="4"] .card{background:#1f1a17;color:#ddd3c8;border-color:#000}
.card h2{margin:0 0 10px;font-size:19px}
.card .ln{opacity:0;animation:fin .7s forwards;margin:9px 0;white-space:pre-line;line-height:1.42}
.card .ln.red{color:#a01818;font-weight:800}
body[data-act="4"] .card .ln.red{color:#e04040}
.card input{width:100%;font:inherit;font-size:17px;padding:10px 12px;border-radius:12px;border:3px solid #3b2a1e;margin-top:8px;background:#fff;color:var(--ink)}
.card .go{width:100%;margin-top:14px;background:var(--accent);color:#fff;opacity:0;animation:fin .5s forwards;padding:10px}
.row{display:flex;align-items:center;gap:10px;padding:8px 4px}
.row+.row{border-top:2px dashed rgba(59,42,30,.15)}
.row .ic{font-size:26px;width:34px;text-align:center}
.row .tx{flex:1;font-size:14px;font-weight:800}
.row .tx small{display:block;opacity:.7;font-weight:500}
.sec{font-weight:900;margin:12px 0 2px;font-size:13px;opacity:.6;text-transform:uppercase;letter-spacing:.05em}
.entry{padding:8px 2px;font-size:13px}
.entry+.entry{border-top:2px dashed rgba(59,42,30,.15)}
.entry b{display:block;margin-bottom:3px}
.entry p{margin:3px 0;white-space:pre-line}
.letter{background:#fffaf0;border:2px solid #cdb999;border-radius:6px;padding:12px;font-family:Georgia,serif;font-style:italic;white-space:pre-line;margin:8px 0;color:#3b2a1e;line-height:1.45}

#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:36;transition:opacity .5s}
#crash{position:fixed;inset:0;z-index:90;background:#e9e9e9;color:#333;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;text-align:center;padding:30px}

#crash .big{font-size:64px}

#crash p{font-size:13px;color:#777;margin:4px}

#crash.evil{background:#000;color:#b01010}
#crash.evil p{color:#801010}
#ending{background:#000;z-index:70}
#ending .card{background:transparent;color:#cfc8c0;text-align:center;font-size:17px;border:0;box-shadow:none}
#ending .go{background:#222;color:#ccc;border-color:#444}

/* ---- avvio a schermo intero + orizzontale ---- */
#start,#rotate{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;color:#3b2a1e;background:radial-gradient(circle at 50% 40%,#bfe39a,#7fb85a 60%,#4f8a3a)}

#start.s3 .sub{color:#4a1010;opacity:.85}
#start.s4,#start.s5{background:radial-gradient(circle at 50% 45%,#2a0d0b,#110605 55%,#000);color:#d8cfc4}
#start.s4 h1,#start.s5 h1{color:#b01a1a;text-shadow:0 0 12px rgba(160,0,0,.6);animation:jit .18s steps(2) infinite}
#start.s4 .logo,#start.s5 .logo{animation:beat 1.1s ease-in-out infinite}
#start.s4 button,#start.s5 button{background:#2a221d;color:#d8cfc4;border-color:#000;animation:none}
#start.s4 .sub,#start.s5 .sub{color:#e04040}
#start.s4::after,#start.s5::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 2px,transparent 2px 4px);mix-blend-mode:multiply}
#start.s5 h1{color:#6d6d6d;text-shadow:none;animation:none}
#start.eco .sub{color:#7a1a12;opacity:.7}
#start .flick{animation:none!important;opacity:.15}
@keyframes sag{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg) translateY(4px)}}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.12)}24%{transform:scale(1)}36%{transform:scale(1.08)}}
@keyframes jit{0%{transform:translate(0,0)}50%{transform:translate(-1px,1px)}100%{transform:translate(1px,0)}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
/* layout orizzontale basso (smartphone) */
@media (orientation:landscape) and (max-height:500px){
  #hud{top:calc(6px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));right:calc(8px + env(safe-area-inset-right))}
  .pill{font-size:13px;padding:3px 8px;border-width:2px}
  #hud button{padding:3px 8px;border-width:2px}
  #bar{bottom:calc(8px + env(safe-area-inset-bottom))}
  #bar .slot{width:44px;height:44px;font-size:21px}
  #act{width:78px;height:78px;bottom:calc(14px + env(safe-area-inset-bottom));right:calc(14px + env(safe-area-inset-right))}
  body.touch #bar{right:calc(104px + env(safe-area-inset-right))}
  #toast{top:16%;font-size:14px;max-width:70vw}
  .ov{padding:8px calc(10px + env(safe-area-inset-right)) 8px calc(10px + env(safe-area-inset-left))}
  .card{max-width:min(640px,92vw);max-height:calc(100vh - 16px);padding:12px 16px;border-width:3px}
  .card h2{font-size:17px;margin-bottom:6px}
  .card .ln{margin:6px 0;font-size:14px}
  .card .go{margin-top:10px;padding:8px}
  .card input{margin-top:4px;padding:8px 10px}
  #crash .big{font-size:44px}
  #dbg{top:44px}
}
@keyframes fin{to{opacity:1}}
</style>

/* ---------------- utilità ---------------- */
const $ = s => document.querySelector(s);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sleepMs = ms => new Promise(r => setTimeout(r, ms));
function fmtDur(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 60) return s + (s === 1 ? " secondo" : " secondi");
  const m = Math.floor(s / 60);
  if (m < 60) return m + (m === 1 ? " minuto" : " minuti");
  const h = Math.floor(m / 60), mm = m % 60;
  if (h < 24) return h + (h === 1 ? " ora" : " ore") + (mm ? " e " + mm + " min" : "");
  const d = Math.floor(h / 24), hh = h % 24;
  return d + (d === 1 ? " giorno" : " giorni") + (hh ? " e " + hh + (hh === 1 ? " ora" : " ore") : "");

let seed = 1337; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

/* =====================================================================
   AUDIO — tutto sintetizzato con Web Audio, nessun file esterno
   ===================================================================== */
const SND = (() => {
  let ac = null, master, mus, amb, sfx, revIn, lp, nb, windG, windF, droneG;
  let on = localStorage.getItem("orto_mute") !== "1";
  let nextT = 0, ni = 0, loop = 0, lastHB = 0;
  const MEL = [0, 4, 7, 12, 11, 7, 4, 2, 0, 4, 7, 9, 7, 4, 2, -1, 0, 2, 4, 7, 9, 7, 4, 0, 2, 4, 2, -1, 0, -1, -1, -1];

  function impulse(dur, dec) {

    return b;
  }
  function init() {
    if (ac) { if (ac.state === "suspended" && !document.hidden) ac.resume(); return; }
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;

    master = ac.createGain(); master.gain.value = on ? 0.85 : 0; master.connect(ac.destination);
    lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 20000; lp.connect(master);
    mus = ac.createGain(); mus.gain.value = 0.2; mus.connect(lp);
    amb = ac.createGain(); amb.gain.value = 0.6; amb.connect(lp);
    sfx = ac.createGain(); sfx.gain.value = 0.75; sfx.connect(master);
    const conv = ac.createConvolver(); conv.buffer = impulse(3, 2.4);
    revIn = ac.createGain(); revIn.gain.value = 0.05; revIn.connect(conv); conv.connect(master);
    sfx.connect(revIn); mus.connect(revIn);
    nb = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const w = ac.createBufferSource(); w.buffer = nb; w.loop = true;
    windF = ac.createBiquadFilter(); windF.type = "bandpass"; windF.frequency.value = 500; windF.Q.value = 0.7;
    windG = ac.createGain(); windG.gain.value = 0; w.connect(windF); windF.connect(windG); windG.connect(amb); w.start();
    const lfo = ac.createOscillator(); lfo.frequency.value = 0.11; const lg = ac.createGain(); lg.gain.value = 260; lfo.connect(lg); lg.connect(windF.frequency); lfo.start();
    droneG = ac.createGain(); droneG.gain.value = 0;
    const df = ac.createBiquadFilter(); df.type = "lowpass"; df.frequency.value = 170; df.connect(droneG); droneG.connect(amb);
    for (const f of [55, 55.7, 82.1, 41.2]) { const o = ac.createOscillator(); o.type = "sawtooth"; o.frequency.value = f; o.connect(df); o.start(); }
    nextT = ac.currentTime + 0.3;
    setInterval(schedule, 60); setInterval(ambTick, 300);
  }
  const T = () => ac.currentTime;
  function envGain(dest, t, a, peak, dec) { const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + dec); g.connect(dest); return g; }
  function tone(f, type, t, a, dec, peak, dest = sfx, f2, detune = 0) {
    const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.detune.value = detune;
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + a + dec);
    o.connect(envGain(dest, t, a, peak, dec)); o.start(t); o.stop(t + a + dec + 0.05); return o;
  }
  function noise(t, a, dec, peak, ft, ff, q = 1, dest = sfx, ff2) {
    const s = ac.createBufferSource(); s.buffer = nb; const f = ac.createBiquadFilter(); f.type = ft; f.frequency.setValueAtTime(ff, t); f.Q.value = q;
    if (ff2) f.frequency.exponentialRampToValueAtTime(ff2, t + a + dec);
    s.connect(f); f.connect(envGain(dest, t, a, peak, dec)); s.start(t, Math.random()); s.stop(t + a + dec + 0.05);

  function box(f, t, det, vol) { tone(f, "sine", t, 0.004, 1.3, 0.28 * vol, mus, 0, det); tone(f * 4.01, "sine", t, 0.002, 0.35, 0.05 * vol, mus, 0, det); }
  function schedule() {
    if (!ac || ac.state !== "running") return;
    const st = audioState(), a = st.act;
    while (nextT < T() + 0.2) {
      let step = [0.26, 0.28, 0.34, 0.46, 0.6][a];

      const n = MEL[ni % MEL.length];

/* ---------------- assenze ---------------- */
function detectCheat() {
  const rolled = p.lastLocal && Date.now() < p.lastLocal - 120e3, skew = db && Math.abs(offset) > 5 * 60e3;
  p.lastLocal = Date.now(); return rolled || skew;
}
function findNight(a, b) { const stop = Math.min(b, a + 7 * 24 * H); for (let t = a; t < stop; t += 5 * 60e3) if (new Date(t).getHours() < 4) return hm(t); return null; }
function maybeAdvance() {
  const req = ACT_REQ[p.act + 1]; if (!req) return;
  if (p.bi >= BEATS[p.act].length && p.abs >= req.abs && p.away >= req.away && (!req.under || p.flags.under)) { p.act++; p.bi = 0; p.diary = p.act + 1; }
}
function applyAbsence(ms, kind, start, end) {
  if (ended || !p) return;
  const cheat = detectCheat();
  ms = Math.max(0, ms || 0);
  if (ms < 1500 && !cheat) return;
  const eff = ms * SPEED, counted = ms >= MIN_ABS;
  let ripe = 0, dry = 0, growing = 0;
  if (!(p.act >= 4 && p.flags.a4)) for (const q of p.plots) {
    if (q.t || !q.s) continue;
    const sd = SEEDS[q.s];
    if (!q.w && p.up.sprinkler) q.w = 1;
    if (!q.w) { dry++; continue; }
    const was = q.g >= sd.grow; q.g += eff * fertMul();
    if (!was && q.g >= sd.grow) ripe++; else if (!was) growing++;
  }
  p.energy = Math.min(emax(), p.energy + Math.floor(eff / 20000));
  if (kind === "closed") { scene = "house"; computeV(); pl.x = 230; pl.y = 260; document.body.classList.add("nohud"); }
  if (!counted && !cheat) { if (ripe) toast(`🌱 ${ripe === 1 ? "Una piantina è pronta" : ripe + " piantine sono pronte"}!`); updHud(); save(); return; }

  p.abs++; p.away += eff;
  if (kind === "closed") { p.closes++; bumpStat("closes"); } else p.hides++;
  const before = p.act;
  if (kind === "closed") maybeAdvance();
  const a = p.act, L = [], red = new Set();
  if (ripe) L.push(a >= 4 ? `${ripe} ${ripe === 1 ? "cosa è maturata" : "cose sono maturate"} nel campo.` : `🌱 ${ripe === 1 ? "Una piantina è pronta" : ripe + " piantine sono pronte"} da raccogliere!`);
  else if (growing) L.push(a >= 3 ? "Le piante sono cresciute. Le ho nutrite io." : "🌿 Le piantine sono cresciute un po'.");
  if (dry) L.push(`💧 ${dry === 1 ? "Una piantina non era innaffiata" : dry + " piantine non erano innaffiate"}: niente crescita.`);
  if (a >= 4 && p.flags.a4) L.push("Mentre eri via non è cresciuto niente. Non c'era più nessuno da piantare.");
  if (eco.endings > 0 && !p.flags.eco) { p.flags.eco = 1; L.push(`Bentornato${eco.last ? ", " + eco.last : ""}.\nTi ricordi la strada per il pozzo?`); red.add(L.length - 1); }

  if (kind === "closed") {
    if (a >= 4 && p.flags.a4) {
      const free = p.plots.filter(x => !x.t);
      const n = Math.min(free.length, clamp(1 + Math.floor(eff / H), 1, 3));
      for (let i = 0; i < n; i++) Object.assign(free.splice(Math.floor(Math.random() * free.length), 1)[0], { ...emptyPlot(), t: 1 });
      L.push(`Hai chiuso gli occhi. Ho preso ${n} ${n === 1 ? "aiuola" : "aiuole"}.\nAdesso ${n === 1 ? "è una tomba" : "sono tombe"}. Indovina di chi è l'ultima.`); red.add(L.length - 1);
      if (p.plots.every(x => x.t)) p.ended = 1;
    }
    if (p.bi < BEATS[a].length) { L.push(BEATS[a][p.bi]()); if (a >= 3) red.add(L.length - 1); p.bi++; }
    else if (a === 3 && !p.flags.under) { L.push("Il pozzo è aperto. Scendi. Ti aspetto giù."); red.add(L.length - 1); }
    else if (POOL[a].length && Math.random() < 0.75) { L.push(pick(POOL[a])()); if (a >= 3) red.add(L.length - 1); }
    if (a >= 2 && Math.random() < 0.5) { const t = findNight(start, end); if (t) { L.push(a >= 3 ? `Alle ${t} ero nel campo. Con le tue mani.` : `🌙 Alle ${t} la luce di casa si è accesa. Tu dormivi.`); } }
    if (ms > 3 * 24 * H && a >= 1) { plantOdd(12); L.push(`Sei stato via ${fmtDur(ms)}.\nHo continuato a seminare al posto tuo.`); red.add(L.length - 1); }
  } else {
    const hp = HPOOL[a];
    if (hp.length && (a >= 4 || Math.random() < 0.55)) L.push(pick(hp).replace("{dur}", fmtDur(ms)));
  }
  if (cheat) L.push(a === 0 ? "🕰️ L'orologio del tuo telefono sembra sbagliato. Le piantine usano l'orologio vero!" :
    (db ? `🕰️ Il tuo orologio dice ${hm(Date.now())}. Il mio dice ${hm(now())}.\n` : "🕰️ Il tempo è tornato indietro.\n") + "Hai provato a ingannare il tempo. Anche io lo faccio.");
  if (bcast && bcast.id && bcast.text && !p.flags["bc_" + bcast.id] && a >= (bcast.minAct || 0)) { p.flags["bc_" + bcast.id] = 1; L.push("📜 " + bcast.text); }
  const title = (kind === "closed" ? ["🌙 Mentre dormivi", "🌙 Mentre dormivi", "🌙 Mentre dormivi", "🌑 Mentre avevi gli occhi chiusi", "🩸 Mentre eri via, io"][a] : "👀 Sei tornato") + ` (${fmtDur(ms)}${DEBUG ? " ≈ " + fmtDur(eff) : ""})`;
  L.push(`⚡ Energia: ${p.energy}/${emax()}`);
  p.journal.push({ t: now(), title, lines: L }); if (p.journal.length > 40) p.journal = p.journal.slice(-40);
  stare = 0; him.on = 0; saveNow();
  frozen = true;
  if (kind === "closed" && a >= 2) setTimeout(() => SND.fx.knock(), 400);
  if (a >= 3) setTimeout(() => SND.fx.sting(), 200);
  modal({ title, lines: L, red: i => red.has(i), btn: a >= 4 ? "Resto qui" : a >= 3 ? "Apri gli occhi" : "Ok! 🌱", cb: () => {
    frozen = false; applyAct(); updHud(); renderBar();
    if (p.flags.crash && !p.flags.crashed) { p.flags.crashed = 1; save(); fakeCrash(); }
    if (before !== a) SND.fx.rev();
    if (p.ended) startFinal();
  } });
}

  for (let k = 0; k < 40; k++) { const x = 30 + k * 43, len = 30 + (k * 37) % 70, sw = Math.sin(t / 1200 + k) * 3; ctx.lineWidth = 3 + (k % 3); ctx.beginPath(); ctx.moveTo(x, 140); ctx.quadraticCurveTo(x + sw, 140 + len / 2, x + sw * 2, 140 + len); ctx.stroke(); }

  // corda
  ctx.strokeStyle = "#b9a074"; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(110, 0); ctx.lineTo(110 + Math.sin(t / 900) * 4, 290); ctx.stroke();
  ctx.fillStyle = "rgba(200,220,255,.08)"; ctx.beginPath(); ctx.moveTo(70, 0); ctx.lineTo(150, 0); ctx.lineTo(200, 330); ctx.lineTo(20, 330); ctx.closePath(); ctx.fill();
}
function underItems(t) {
  const L = [];
  mounds().forEach((m, i) => { const q = MOUND_POS(i); L.push({ y: q.y + 20, d: () => {
    ell(q.x, q.y + 10, 48, 22, "#3d2a1c"); ell(q.x, q.y + 4, 38, 15, "#4a3322", 2);
    ell(q.x - 8, q.y - 4, 18, 5, "#8a7a4a", 2); rrect(q.x - 16, q.y - 14, 16, 10, 4, "#8a7a4a", 2);

    rrect(q.x + 30, q.y - 40, 5, 50, 1, "#5a4a3a", 2); rrect(q.x + 3, q.y - 46, 60, 18, 2, "#7a6a54", 2);
    ctx.font = "bold 8px sans-serif"; ctx.fillStyle = "#1a110b"; ctx.textAlign = "center"; ctx.fillText((m.name || "???").slice(0, 13), q.x + 33, q.y - 34); ctx.textAlign = "left";
  } }); });
  L.push({ y: 250, d: () => { rrect(1300, 205, 60, 45, 3, "#4a3322"); rrect(1306, 196, 48, 14, 2, "#5a1a14", 2); ctx.fillStyle = "#e8dcc0"; ctx.fillRect(1310, 199, 40, 8); } });
  L.push({ y: 420, d: () => { ell(1380, 410, 48, 20, "#050302"); ell(1380, 404, 44, 15, "#0a0604", 2); rrect(1420, 360, 5, 50, 1, "#5a4a3a", 2); rrect(1394, 352, 60, 18, 2, "#d9c8a8", 2); ctx.font = "bold 8px sans-serif"; ctx.fillStyle = "#7a0a0a"; ctx.textAlign = "center"; ctx.fillText(p.name.slice(0, 13), 1424, 364); ctx.textAlign = "left"; } });
  L.push({ y: HEART.y + 60, d: () => {
    const pu = 1 + Math.sin(t / 380) * 0.05, { x, y, r } = HEART;
    ctx.strokeStyle = "#3a1a14"; ctx.lineWidth = 8; for (let k = 0; k < 10; k++) { const an = k / 10 * Math.PI * 2; ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + Math.cos(an) * r * 1.3, y + Math.sin(an) * r, x + Math.cos(an + 0.4) * r * 2.1, y + Math.sin(an + 0.4) * r * 1.6); ctx.stroke(); }
    ell(x, y, r * pu, r * 0.85 * pu, "#4a1612"); ell(x - 20, y - 15, r * 0.5 * pu, r * 0.4 * pu, "#5e1e18", 2);
    for (let k = 0; k < 14; k++) { const an = k * 2.4, rr = r * 0.6 * ((k % 4) / 4 + 0.3); const tx = x + Math.cos(an) * rr, ty = y + Math.sin(an) * rr * 0.8; rrect(tx - 3, ty - 4 + Math.sin(t / 200 + k) * 1.5, 6, 8, 2, "#efe8d6", 1.5); }

}

/* --- luce --- */
const light = document.createElement("canvas"), lctx = light.getContext("2d");
function drawLight(t) {
  let d, holes = [];
  const a = p.act;
  if (scene === "farm") { d = Math.min(0.9, (isNight() ? 0.55 : 0) + [0, 0, 0.1, 0.32, 0.55][a]); holes.push([pl.x, pl.y - 30, a >= 4 ? 150 : 210]); if (isNight() || a >= 3) holes.push([HOUSE.x - 50, HOUSE.y - 70, 70], [HOUSE.x + 56, HOUSE.y - 70, 60]); }
  else if (scene === "house") { d = Math.min(0.85, [0.05, 0.1, 0.25, 0.42, 0.6][a] + (isNight() ? 0.2 : 0)); holes.push([pl.x, pl.y - 30, 220], [525, 310, a >= 1 ? 140 : 90], [135, 60, 90]); }
  else if (scene === "under") { d = 0.94; holes.push([pl.x, pl.y - 30, 165], [110, 80, 120], [HEART.x, HEART.y, 150]); }
  else d = 0;
  if (d <= 0) return;
  if (light.width !== cv.width || light.height !== cv.height) { light.width = cv.width; light.height = cv.height; }
  lctx.setTransform(1, 0, 0, 1, 0, 0); lctx.globalCompositeOperation = "source-over";
  lctx.clearRect(0, 0, light.width, light.height);
  lctx.fillStyle = scene === "under" ? `rgba(12,4,2,${d})` : `rgba(8,8,18,${d})`; lctx.fillRect(0, 0, light.width, light.height);
  lctx.globalCompositeOperation = "destination-out";
  const flick = scene === "under" ? 1 + Math.sin(t / 90) * 0.03 : 1;
  for (const [wx, wy, r] of holes) {
    const sx = (wx - camX) * zoom * dpr, sy = (wy - camY) * zoom * dpr, R = r * zoom * dpr * flick;
    const g = lctx.createRadialGradient(sx, sy, R * 0.2, sx, sy, R); g.addColorStop(0, "rgba(0,0,0,1)"); g.addColorStop(1, "rgba(0,0,0,0)");
    lctx.fillStyle = g; lctx.beginPath(); lctx.arc(sx, sy, R, 0, 7); lctx.fill();

}
let glitchT = 0;
function drawGlitch(dt) {
  if (!p || scene === "final") return;
  const a = p.act;
  if (glitchT <= 0 && a >= 3 && Math.random() < (a >= 4 ? 0.006 : 0.0025)) { glitchT = 0.15 + Math.random() * 0.3; SND.fx.glitch(); }
  if (glitchT > 0) {
    glitchT -= dt;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    for (let k = 0; k < 6; k++) { const y = Math.random() * cv.height, h = 8 + Math.random() * 50, off = (Math.random() - 0.5) * 60 * dpr; ctx.drawImage(cv, 0, y, cv.width, h, off, y, cv.width, h); }
    ctx.fillStyle = `rgba(${Math.random() < 0.5 ? "160,0,0" : "0,0,0"},${0.15 + Math.random() * 0.2})`; ctx.fillRect(0, 0, cv.width, cv.height);
  }
}

/* ---------------- loop di render ---------------- */
let last = performance.now(), lastLbl = "";
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (p) {
    computeV();
    move(dt);
    if (scene === "final") updateFinal(dt);
    const [sw, sh] = SIZE[scene];
    camX = vw >= sw ? (sw - vw) / 2 : clamp(pl.x - vw / 2, 0, sw - vw);
    camY = vh >= sh ? (sh - vh) / 2 : clamp(pl.y - 40 - vh / 2, 0, sh - vh);
    if (him.on && scene === "farm") {
      him.a = Math.min(p.act >= 4 ? 0.9 : 0.75, him.a + dt * 0.25);
      if (dist(pl.x, pl.y, him.x, him.y) < 230) { him.on = 0; him.cool = p.act >= 4 ? 8 : 40; stare = 0; const hn = himName(); toast(p.act >= 4 ? "Resta qui." : hn && Math.random() < 0.5 ? `Non guardare ${hn}.\nEra un erede, come te.` : "Non guardarlo."); SND.fx.sting(); }
    }
    ctx.setTransform(dpr * zoom, 0, 0, dpr * zoom, -camX * dpr * zoom, -camY * dpr * zoom);
    const tg = frozen || mOpen ? null : target();
    const list = [];
    if (scene === "farm" || scene === "final") {
      drawGround(t);
      V.plots.forEach((_, i) => drawPlot(i));
      if (tg && tg.kind === "plot") { const q = plotPos(tg.i); ctx.strokeStyle = "rgba(255,240,180,.9)"; ctx.lineWidth = 3; ctx.setLineDash([6, 5]); ctx.beginPath(); ctx.roundRect(q.x - PW / 2 - 4, q.y - PH / 2 - 4, PW + 8, PH + 8, 12); ctx.stroke(); ctx.setLineDash([]); }
      V.plots.forEach((_, i) => list.push({ y: plotPos(i).y + 12, d: () => drawCrop(i, t) }));
      for (const tr of trees) if (tr.x > camX - 80 && tr.x < camX + vw + 80 && tr.y > camY - 20 && tr.y < camY + vh + 160) list.push({ y: tr.y, d: () => drawTree(tr, t) });
      list.push({ y: HOUSE.y, d: () => drawHouse(t) }, { y: WELL.y, d: () => drawWell(t) }, { y: STALL.y, d: drawStall }, { y: MAILBOX.y, d: drawMailbox }, { y: GINO.y, d: () => drawGino(t) }, { y: SCARE_POS[V.scare].y, d: () => drawScare(t) });
      list.push(...drawFence());
      if (scene === "final") {
        list.push({ y: ghost.y, d: () => { drawFarmer(ghost.x, ghost.y, ghost.face, ghost.look > 0 || ghost.warn > 0 ? 0 : ghost.walk, t, { can: true, name: ghost.name }); if (ghost.warn > 0) txt("!", ghost.x, ghost.y - 92, 22, "#c0392b"); if (ghost.look > 0) txt("👁", ghost.x, ghost.y - 92, 18, "#000"); } });
        list.push({ y: pl.y, d: () => drawHim(pl.x, pl.y, 1, t, true) });
      } else {
        list.push({ y: pl.y, d: () => drawFarmer(pl.x, pl.y, pl.face, pl.walk, t, { can: p.can > 0, black: p.act >= 4 && glitchT > 0 }) });
        if (him.on) list.push({ y: him.y, d: () => drawHim(him.x, him.y, him.a, t, p.act >= 4) });
      }
    } else if (scene === "house") {
      drawHouseIn(t); list.push(...houseItems(t));
      rrect(IN.door.x - 28, IN.h - 14, 56, 14, 2, "#3a2a1e");
      list.push({ y: pl.y, d: () => drawFarmer(pl.x, pl.y, pl.face, pl.walk, t, { can: p.can > 0 }) });
    } else if (scene === "under") {
      drawUnder(t); list.push(...underItems(t));

    }

    if (scene === "final") { ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.setLineDash([4, 6]); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(HOUSE.x, HOUSE.y + 14, 30 + Math.sin(t / 300) * 4, 0, 7); ctx.stroke(); ctx.setLineDash([]); }
    for (let i = fxl.length - 1; i >= 0; i--) { const f = fxl[i]; f.y -= dt * 30; f.a -= dt * 0.8; if (f.a <= 0) { fxl.splice(i, 1); continue; } ctx.globalAlpha = f.a; txt(f.t, f.x, f.y, 18, "#fff"); ctx.globalAlpha = 1; }
    drawLight(t);
    ctx.setTransform(dpr * zoom, 0, 0, dpr * zoom, -camX * dpr * zoom, -camY * dpr * zoom);
    if (tg && tg.r && !isTouch) {
      const s = "[E] " + label(tg); ctx.font = "bold 14px sans-serif"; const w = ctx.measureText(s).width + 16;
      rrect(tg.x - w / 2, tg.ly - 20, w, 26, 8, p.act >= 4 ? "rgba(30,24,20,.95)" : "rgba(246,236,217,.95)", 2.5); txt(s, tg.x, tg.ly - 2, 14, p.act >= 4 ? "#ddd" : OUT);
    }
    if (isTouch) { const s = scene === "final" ? "🌑" : short(tg && tg.r ? tg : null); if (s !== lastLbl) { lastLbl = s; $("#act").textContent = s; $("#act").disabled = !(tg && tg.r); } }

}

/* ---------------- debug ---------------- */
function debugPanel() {
  const d = document.createElement("div"); d.id = "dbg";
  d.innerHTML = `<div id="dbgi"></div><button data-a="c">⏩ chiusura 1h</button><button data-a="h">👀 cambio app 5m</button><button data-a="a">⬆️ atto +1</button><button data-a="m">🪙 +500</button><button data-a="u">🕳️ sottoterra</button><button data-a="f">🌑 finale</button><button data-a="r">🗑️ reset</button>`;
  document.body.appendChild(d);
  d.addEventListener("click", e => {
    const a = e.target.dataset.a; if (!a || !p) return; const n = now();
    if (a === "c") applyAbsence(H / SPEED, "closed", n - H, n);
    if (a === "h") applyAbsence(5 * 60e3 / SPEED, "hidden", n - 5 * 60e3, n);
    if (a === "a" && p.act < 4) { p.act++; p.bi = 0; applyAct(); renderBar(); save(); }
    if (a === "m") { p.coins += 500; updHud(); save(); }
    if (a === "u") { p.flags.well = 1; p.flags.under = 1; loadFallen(); changeScene("under", 150, 300); }
    if (a === "f") { p.ended = 1; startFinal(); }
    if (a === "r" && confirm("Reset partita?")) resetGame();
  });
  setInterval(() => { if (p) $("#dbgi").textContent = `atto ${p.act} · beat ${p.bi}/${BEATS[p.act].length}\nassenze ${p.abs} (chiuso ${p.closes})\nvia ${fmtDur(p.away)} · ${scene}\nfirebase ${db ? "ok" : "OFF"}`; }, 1000);
}

/* ---------------- avvio ---------------- */
async function boot() {
  requestAnimationFrame(frame);
  await initFB();
  pid = localStorage.getItem("orto_pid");
  if (!pid || !/^o_[a-z0-9]{10,24}$/.test(pid)) {
    pid = "o_" + Array.from(crypto.getRandomValues(new Uint8Array(16)), b => (b % 36).toString(36)).join("");
    localStorage.setItem("orto_pid", pid);
  }
  if (db) pref = F.ref(db, `${ROOT}/players/${pid}`);
  try { trail = JSON.parse(localStorage.getItem("orto_trail_" + pid)) || []; } catch { trail = []; }
  let local = null, remote = null;
  try { local = JSON.parse(localStorage.getItem(LSK())); } catch {}
  if (db) remote = await fbGet(`${ROOT}/players/${pid}`);
  let saved = remote && local ? ((remote.saveAt || 0) >= (local.saveAt || 0) ? remote : local) : (remote || local);
  if (remote && saved && saved !== remote && remote.lastSeen > (saved.lastSeen || 0)) saved.lastSeen = remote.lastSeen;
  if (DEBUG) debugPanel();

  if (!saved) {
    p = fresh("Contadino"); computeV(); applyAct(); updHud(); renderBar();
    const again = eco.endings > 0;
    pl.x = HOUSE.x; pl.y = HOUSE.y + 40;
    modal({ title: "🌱 Il Mio Orticello", lines: [again ? "Benvenuto a Valfiorita!\nCome ti chiami?" : "Benvenuto a Valfiorita!\nHai ereditato la fattoria dello zio Amedeo.\nCome ti chiami, contadino?"], input: "Il tuo nome", btn: "Inizia!",
      cb: v => {
        SND.init();
        p.name = (v || "").trim().slice(0, 16) || "Contadino";
        if (again) letter(`Caro nipote,\nti lascio la fattoria.\nNon chiudere mai gli occhi.\nNon lasciarlo solo con il corpo.`, `Zio ${eco.last}`, 1);
        bumpStat("players"); saveNow(); armDisconnect();
        modal({ title: `Ciao ${p.name}! 👋`, btn: "Andiamo! 🌱", cb: () => { frozen = false; SND.fx.music(); }, lines: [
          isTouch ? "🕹️ Muoviti col joystick: tocca e trascina a sinistra." : "🕹️ Muoviti con WASD o le frecce.",
          isTouch ? "✋ Avvicinati alle cose e premi il tasto giallo." : "✋ Avvicinati alle cose e premi E.",
          "🪣 Riempi l'annaffiatoio al pozzo. Pianta, innaffia, raccogli, vendi al mercato.",
          "🙈 Le piantine sono timide: crescono solo mentre dormi.",
          again ? "🛏️ Quando sei stanco, vai a letto e chiudi il gioco.\nCome l'altra volta." : "🛏️ Quando sei stanco, vai a letto in casa e chiudi il gioco. Al risveglio l'orto sarà cresciuto ✨"] });
      } });
    return;
  }
  p = normalize(saved); computeV(); applyAct(); updHud(); renderBar(); armDisconnect();
  if (p.act >= 3 || p.flags.under) loadFallen();
  if (p.ended) { startFinal(); return; }
  const a = p.hiddenSince || p.lastSeen, b = now();
  p.hiddenSince = 0; frozen = false; pl.x = HOUSE.x; pl.y = HOUSE.y + 40;
  applyAbsence(b - a, "closed", a, b);
  save();
}
/* ---------------- schermo intero + orizzontale ---------------- */
const fsEl = document.documentElement;
const fsOn = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
const fsCan = !!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen);
async function goFull() {
  try {
    if (!fsOn() && fsCan) {
      if (fsEl.requestFullscreen) await fsEl.requestFullscreen({ navigationUI: "hide" });
      else fsEl.webkitRequestFullscreen();
    }
  } catch {}
  try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock("landscape"); } catch {}
  setTimeout(resize, 250);
}
const standalone = matchMedia("(display-mode: fullscreen), (display-mode: standalone)").matches || navigator.standalone;
if (isTouch && !fsCan && !standalone) $("#startHint").textContent = "📲 Per il vero schermo intero: Condividi → «Aggiungi alla schermata Home», poi apri il gioco da lì.";
/* se si esce dallo schermo intero, il prossimo tocco ci rientra */
if (isTouch) addEventListener("pointerup", () => { if (!fsOn() && $("#start").classList.contains("hidden")) goFull(); }, true);
["fullscreenchange", "webkitfullscreenchange"].forEach(ev => document.addEventListener(ev, () => setTimeout(resize, 250)));
addEventListener("orientationchange", () => setTimeout(resize, 300));
/* schermata d'avvio: legge il salvataggio locale e si "guasta" con la storia */
const startLook = (() => {
  let sv = null, act = 0, ended = 0, name = "";
  try { const id = localStorage.getItem("orto_pid"); if (id) sv = JSON.parse(localStorage.getItem("orto_save_" + id)); } catch {}
  if (sv) { act = Math.max(0, Math.min(4, +sv.act || 0)); ended = sv.ended ? 1 : 0; name = String(sv.name || "").slice(0, 16); }
  const st = $("#start"), h1 = st.querySelector("h1"), lg = st.querySelector(".logo"), sub = st.querySelector(".sub"), bt = $("#startBtn");
  const nm = name && name !== "Contadino" ? name : "";
  let lvl = ended ? 5 : act >= 4 ? 4 : act >= 3 ? 3 : act >= 2 ? 2 : 0;
  const L = {
    0: ["🌱", "Il Mio Orticello", "", "▶ Tocca per giocare"],
    2: ["🌿", "Il Mio Orticello", nm ? `Bentornato, ${nm}! L'orto ti aspettava.` : "L'orto ti aspettava.", "▶ Tocca per giocare"],
    3: ["🥀", "Il Mio Orticello", nm ? `${nm}, hai dormito tanto.\nQualcuno ha lavorato al posto tuo.` : "Hai dormito tanto.\nQualcuno ha lavorato al posto tuo.", "▶ Apri gli occhi"],
    4: ["🩸", "Il Mio Orticello.", "Non chiudere più gli occhi.", "▶ Torna da me"],
    5: ["👁️", "Il Mio Orticello.", "Sei ancora qui.", "▶ …"],
  }[lvl];
  if (!sv && eco.endings > 0) { st.classList.add("eco"); L[2] = "Bentornato."; }
  if (lvl) st.classList.add("s" + lvl);
  [lg.textContent, h1.textContent, sub.textContent, bt.textContent] = L;
  if (lvl >= 2) document.querySelector('meta[name="theme-color"]').content = lvl >= 4 ? "#000000" : "#2b2a22";
  /* piccoli guasti casuali: titolo/logo che cambiano per un attimo */
  const glitches = {
    0: eco.endings > 0 ? [["logo", "🩸", 120]] : [],
    2: [["logo", "🥀", 160]],
    3: [["h1", "Il Mio Orticello.", 400], ["logo", "👁️", 200], ["flick", "", 140]],
    4: [["h1", "NON CHIUDERE", 260], ["h1", "Il Mio Corpo.", 300], ["logo", "👁️", 250], ["flick", "", 90], ["sub", nm ? `${nm}, ${nm}, ${nm}` : "ti vedo", 500]],
    5: [["h1", "Grazie per il corpo.", 600], ["logo", "🌱", 300]],
  }[lvl] || [];
  if (!glitches.length) return;
  const els = { h1, logo: lg, sub };
  const tick = () => {
    if (st.classList.contains("hidden")) return;
    const [k, txt, ms] = pick(glitches);
    if (k === "flick") { const kids = st.querySelectorAll(".logo,h1,.sub,button"); kids.forEach(e => e.classList.add("flick")); setTimeout(() => kids.forEach(e => e.classList.remove("flick")), ms); }
    else { const e = els[k], old = e.textContent; e.textContent = txt; setTimeout(() => e.textContent = old, ms); }
    setTimeout(tick, (lvl >= 4 ? 900 : lvl === 3 ? 1800 : 4000) + Math.random() * (lvl >= 4 ? 1800 : 3500));
  };
  setTimeout(tick, lvl >= 4 ? 700 : 2500);
})();
$("#startBtn").addEventListener("click", () => {
  SND.init(); goFull();
  $("#start").classList.add("hidden");
  boot();
}, { once: true });
